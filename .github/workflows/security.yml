name: Security Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + form standards
        run: npm run lint

      - name: Type check
        run: npm exec tsc --noEmit

      - name: QA smoke tests
        run: npm test

      - name: Dependency audit (high+)
        run: npm run audit:high

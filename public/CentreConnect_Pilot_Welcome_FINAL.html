<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CentreConnect Welcome Pack</title>
  <meta http-equiv="refresh" content="0;url=/ecd/welcome" />
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #0f172a;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .card {
      max-width: 560px;
      margin: 24px;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    .title {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
    }
    .text {
      margin: 0;
      color: #475569;
      line-height: 1.6;
    }
    .link {
      color: #0f766e;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="title">Opening your interactive welcome pack...</h1>
    <p class="text">
      If this takes more than a moment, <a class="link" id="fallback-link" href="/ecd/welcome">tap here</a>.
    </p>
  </main>
  <script>
    (function () {
      var query = window.location.search || '';
      var hash = window.location.hash || '';
      var target = '/ecd/welcome' + query + hash;
      var fallback = document.getElementById('fallback-link');
      if (fallback) fallback.setAttribute('href', target);
      window.location.replace(target);
    })();
  </script>
</body>
</html>
